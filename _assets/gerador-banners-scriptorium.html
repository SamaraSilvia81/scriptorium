  :root {
    --void: #0B0B0B; --surface: #141413; --surface-alt: #1A1A18;
    --phosphor: #972fff; --ember: #ff22d6; --bone: #E8E4DE; --muted: #6B6B63; --rule: #252523; --rule-light: #2E2E2A;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--void); color: var(--bone); font: 15px/1.5 "SC Body", system-ui, sans-serif; }
  header { padding: 20px 28px; border-bottom: 1px solid var(--rule); background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font: 700 20px "SC Display", sans-serif; }
  header h1::before { content: "$ "; color: var(--phosphor); font-family: "SC Mono", monospace; font-weight: 500; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  main { padding: 24px 28px 60px; display: grid; gap: 22px; max-width: 1700px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--rule); overflow: hidden; }
  .card canvas { display: block; width: 100%; height: auto; }
  .fields { display: grid; grid-template-columns: 170px repeat(4, minmax(0, 1fr)) auto; gap: 10px; padding: 14px; align-items: end; }
  .fields.rodape { grid-template-columns: 170px minmax(0, 1fr) auto; }
  label { display: grid; gap: 4px; font: 12px "SC Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); font: 14px "SC Body", sans-serif; color: var(--bone); background: var(--void); border-radius: 0; }
  input[type=text]:focus { outline: none; border-color: var(--phosphor); }
  button, select { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--void); color: var(--bone); padding: 9px 14px; font: 500 13px "SC Mono", monospace; cursor: pointer; white-space: nowrap; border-radius: 0; }
  button.primary { background: var(--ember); border-color: var(--ember); color: #fff; }
  button:hover, select:hover { border-color: var(--phosphor); }
  button.primary:hover { filter: brightness(1.08); }
  @media (max-width: 1100px) { .fields, .fields.rodape { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Gerador de banners · Scriptorium</h1>
    <p>Edite os textos, escolha o tema e baixe em PNG. Tudo roda neste arquivo, sem internet.</p>
  </div>
  <div class="actions">
    <select id="theme" aria-label="Tema">
      <option value="dark" selected>Tema escuro</option>
      <option value="light">Tema claro</option>
    </select>
    <select id="scale" aria-label="Resolução">
      <option value="1">1× (1600 px)</option>
      <option value="2" selected>2× (3200 px, mais nítido)</option>
    </select>
    <button class="primary" id="downloadAll" type="button">Baixar todos</button>
  </div>
</header>
<main id="list"></main>

<script>
const W = 1600;

// Tokens da identidade (mesmos valores do site).
const THEMES = {
  dark:  { void: "#0B0B0B", surface: "#141413", phosphor: "#972fff", ember: "#ff22d6", bone: "#E8E4DE", muted: "#8A8A80", rule: "#252523", grid: "232,228,222", grainAlpha: 0.10, scan: "rgba(0,0,0,0.22)", glow: 0.30 },
  light: { void: "#F7F5F2", surface: "#FFFFFF", phosphor: "#7B1FE0", ember: "#D41AAF", bone: "#1A1A18", muted: "#6B6B63", rule: "#DDD9D3", grid: "26,26,24", grainAlpha: 0.10, scan: "rgba(0,0,0,0.025)", glow: 0.20 },
};
let T = THEMES.dark;

// Banners prontos. t1 fica em bone e t2 em phosphor.
const PRESETS = [
  { file: "banner-topo",        chip: "scriptorium · documentação técnica", t1: "Scriptorium",     t2: "",              sub: "Onde se escreve o que o código não diz" },
  { file: "banner-fundamentos", chip: "scriptorium · fundamentos",          t1: "Fundamentos da",  t2: "documentação",  sub: "Por que documentar, para quem e com qual nível de detalhe" },
  { file: "banner-docs-as-code",chip: "scriptorium · docs-as-code",         t1: "Docs as",         t2: "code",          sub: "Documentação versionada, revisada e publicada junto com o código" },
  { file: "banner-na-pratica",  chip: "scriptorium · na prática",           t1: "Documentação",    t2: "na prática",    sub: "READMEs, guias, ADRs e checklists para aplicar em projetos reais" },
  { file: "banner-casos",       chip: "scriptorium · casos e referências",  t1: "Casos e",         t2: "referências",   sub: "Experiências de equipes reais, sempre com a fonte original" },
  { file: "banner-engenharia",  chip: "scriptorium · engenharia de software", t1: "Engenharia de", t2: "software",      sub: "Arquitetura, manutenção, dívida técnica e microfrontends" },
  { file: "banner-rodape",      footer: true, text: "Estudos sobre documentação técnica · por Samara Silvia" },
];

const fontsReady = Promise.all([
  document.fonts.load('700 72px "SC Display"'),
  document.fonts.load('19px "SC Body"'),
  document.fonts.load('400 14px "SC Mono"'),
  document.fonts.load('500 14px "SC Mono"'),
]);

// --- Desenho --------------------------------------------------------------
function noiseCanvas(size = 256) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const x = c.getContext("2d");
  const img = x.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}
const NOISE = noiseCanvas();

function drawBackground(ctx, h) {
  ctx.fillStyle = T.void;
  ctx.fillRect(0, 0, W, h);

  // grade fina, apagando nas bordas
  const grid = document.createElement("canvas");
  grid.width = W; grid.height = h;
  const g = grid.getContext("2d");
  const lines = (step, alpha) => {
    g.strokeStyle = `rgba(${T.grid},${alpha})`; g.lineWidth = 1;
    g.beginPath();
    for (let x = 0.5; x < W; x += step) { g.moveTo(x, 0); g.lineTo(x, h); }
    for (let y = 0.5; y < h; y += step) { g.moveTo(0, y); g.lineTo(W, y); }
    g.stroke();
  };
  lines(32, 0.035); lines(160, 0.07);
  g.globalCompositeOperation = "destination-in";
  const m = g.createRadialGradient(W / 2, h * 0.5, 0, W / 2, h * 0.5, W * 0.5);
  m.addColorStop(0, "rgba(0,0,0,1)"); m.addColorStop(0.35, "rgba(0,0,0,1)"); m.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = m; g.fillRect(0, 0, W, h);
  ctx.drawImage(grid, 0, 0);

  // brilhos phosphor e ember
  ctx.save();
  ctx.filter = "blur(90px)";
  ctx.globalAlpha = T.glow;
  const glow = (color, cx, cy, r) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); };
  glow(T.phosphor, W * 0.92, h * 0.15, 240);
  glow(T.ember, W * 0.80, h * 1.05, 170);
  glow(T.phosphor, W * 0.04, h * 0.95, 150);
  ctx.restore();

  // grão
  ctx.save();
  ctx.globalAlpha = T.grainAlpha;
  ctx.globalCompositeOperation = "overlay";
  ctx.fillStyle = ctx.createPattern(NOISE, "repeat");
  ctx.fillRect(0, 0, W, h);
  ctx.restore();

  // scanlines
  ctx.fillStyle = T.scan;
  for (let y = 2; y < h; y += 3) ctx.fillRect(0, y, W, 1);

  // moldura fina
  ctx.strokeStyle = T.rule; ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, W - 1, h - 1);
}

// Marca em texto: "$ scriptorium" + cursor
function drawWordmark(ctx, x, y) {
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  ctx.font = '500 18px "SC Mono"';
  ctx.fillStyle = T.phosphor; ctx.fillText("$", x, y);
  const dw = ctx.measureText("$ ").width;
  ctx.fillStyle = T.bone; ctx.fillText("scriptorium", x + dw, y);
  const ww = ctx.measureText("scriptorium").width;
  ctx.fillStyle = T.ember; ctx.fillRect(x + dw + ww + 6, y - 10, 10, 20);
}

function spaced(ctx, px) { if ("letterSpacing" in ctx) ctx.letterSpacing = px; }

function drawBanner(ctx, b) {
  const h = 380;
  drawBackground(ctx, h);
  drawWordmark(ctx, 44, 46);

  // selo retangular
  ctx.font = '14px "SC Mono"';
  spaced(ctx, "0.8px");
  const chipText = b.chip;
  const tw = ctx.measureText(chipText).width;
  const ch = 34, cw = tw + 58, cx = (W - cw) / 2;
  const top = Math.round((h - (ch + 22 + 70 + 22 + 22)) / 2);
  const cy = top;
  ctx.fillStyle = T.surface; ctx.globalAlpha = 0.85; ctx.fillRect(cx, cy, cw, ch); ctx.globalAlpha = 1;
  ctx.strokeStyle = T.rule; ctx.lineWidth = 1; ctx.strokeRect(cx + 0.5, cy + 0.5, cw - 1, ch - 1);
  ctx.fillStyle = T.ember; ctx.fillRect(cx + 18, cy + ch / 2 - 4, 8, 8);
  ctx.fillStyle = T.muted; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  ctx.fillText(chipText, cx + 38, cy + ch / 2 + 1);
  spaced(ctx, "0px");

  // título em duas cores + cursor
  ctx.font = '700 72px "SC Display"';
  spaced(ctx, "-1.6px");
  const a = b.t1 && b.t2 ? b.t1 + " " : (b.t1 || "");
  const w1 = ctx.measureText(a).width, w2 = b.t2 ? ctx.measureText(b.t2).width : 0;
  const cursorW = 14, gap = 10;
  let tx = (W - (w1 + w2 + gap + cursorW)) / 2;
  ctx.textBaseline = "alphabetic";
  const base = cy + ch + 22 + 58;
  ctx.fillStyle = T.bone; ctx.fillText(a, tx, base);
  if (b.t2) { ctx.fillStyle = T.phosphor; ctx.fillText(b.t2, tx + w1, base); }
  spaced(ctx, "0px");
  ctx.fillStyle = T.ember; ctx.fillRect(tx + w1 + w2 + gap, base - 52, cursorW, 56);

  // subtítulo
  ctx.font = '20px "SC Body"'; ctx.fillStyle = T.muted; ctx.textAlign = "center";
  ctx.fillText(b.sub, W / 2, base + 46);
  ctx.textAlign = "left";
}

function drawFooter(ctx, b) {
  const h = 140;
  drawBackground(ctx, h);
  drawWordmark(ctx, 56, h / 2);
  ctx.font = '14px "SC Mono"'; ctx.fillStyle = T.muted; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  spaced(ctx, "1px");
  ctx.fillText(b.text.toUpperCase(), W - 56, h / 2 + 1);
  spaced(ctx, "0px");
  ctx.textAlign = "left";
}

function render(b, canvas, scale = 1) {
  const h = b.footer ? 140 : 380;
  canvas.width = W * scale; canvas.height = h * scale;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  b.footer ? drawFooter(ctx, b) : drawBanner(ctx, b);
}

// --- Interface ------------------------------------------------------------
const list = document.getElementById("list");
const cards = [];

function field(labelText, value, onInput) {
  const l = document.createElement("label");
  l.textContent = labelText;
  const i = document.createElement("input");
  i.type = "text"; i.value = value;
  i.addEventListener("input", () => onInput(i.value));
  l.append(i);
  return l;
}

function fileName(b) {
  return document.getElementById("theme").value === "light" ? `${b.file}-claro` : b.file;
}

function download(b) {
  const c = document.createElement("canvas");
  render(b, c, Number(document.getElementById("scale").value));
  c.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${fileName(b)}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
}

for (const preset of PRESETS) {
  const b = { ...preset };
  const card = document.createElement("section");
  card.className = "card";
  const canvas = document.createElement("canvas");
  const fields = document.createElement("div");
  fields.className = "fields" + (b.footer ? " rodape" : "");
  const redraw = () => render(b, canvas, 1);

  fields.append(field("Arquivo", b.file, (v) => (b.file = v.trim() || preset.file)));
  if (b.footer) {
    fields.append(field("Texto", b.text, (v) => { b.text = v; redraw(); }));
  } else {
    fields.append(field("Selo", b.chip, (v) => { b.chip = v; redraw(); }));
    fields.append(field("Título (bone)", b.t1, (v) => { b.t1 = v; redraw(); }));
    fields.append(field("Título (phosphor)", b.t2, (v) => { b.t2 = v; redraw(); }));
    fields.append(field("Subtítulo", b.sub, (v) => { b.sub = v; redraw(); }));
  }
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "primary"; btn.textContent = "Baixar PNG";
  btn.addEventListener("click", () => download(b));
  fields.append(btn);

  card.append(canvas, fields);
  list.append(card);
  cards.push({ b, redraw });
}

const redrawAll = () => cards.forEach((c) => c.redraw());
fontsReady.then(redrawAll);

document.getElementById("theme").addEventListener("change", (e) => { T = THEMES[e.target.value]; redrawAll(); });
document.getElementById("downloadAll").addEventListener("click", () => {
  cards.forEach((c, i) => setTimeout(() => download(c.b), i * 350));
});

// Usado para exportar em lote (automação). Não interfere no uso normal.
window.__exportAll = async (theme = "dark", scale = 2) => {
  T = THEMES[theme];
  await fontsReady;
  return cards.map(({ b }) => {
    const c = document.createElement("canvas");
    render(b, c, scale);
    return { name: theme === "light" ? `${b.file}-claro` : b.file, data: c.toDataURL("image/png") };
  });
};
</script>
</body>
</html>
